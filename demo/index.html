<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本机人脸采集</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>本机人脸采集</h1>
      <div class="connection-state" id="connectionState" data-state="offline">
        <span class="state-dot" aria-hidden="true"></span>
        <span id="connectionLabel">未连接</span>
      </div>
    </header>

    <div class="workspace">
      <section class="preview-column" aria-label="摄像头预览">
        <div class="preview-stage" id="previewStage">
          <img id="previewImage" alt="摄像头实时预览">
          <div class="preview-empty" id="previewEmpty">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h2.2l1.2-2h7.2l1.2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <p>连接本机服务后显示摄像头画面</p>
          </div>
          <div class="face-guide" aria-hidden="true"></div>
        </div>

        <div class="status-message" id="statusMessage" role="status" aria-live="polite" data-tone="info">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>
          <span>等待连接本机采集服务</span>
        </div>
      </section>

      <aside class="control-rail" aria-label="采集控制">
        <section class="controls">
          <label for="cameraSelect">摄像头</label>
          <select id="cameraSelect" disabled>
            <option value="">请先连接并加载设备</option>
          </select>

          <div class="action-stack">
            <button class="button button-primary" id="connectButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 14.5 14.5 9M7.2 17.8l-1 1a3.5 3.5 0 0 1-5-5l3.2-3.2a3.5 3.5 0 0 1 5 0M16.8 6.2l1-1a3.5 3.5 0 0 1 5 5l-3.2 3.2a3.5 3.5 0 0 1-5 0"/></svg>
              连接服务
            </button>
            <button class="button button-secondary" id="openButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h2.2l1.2-2h7.2l1.2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
              打开摄像头
            </button>
            <button class="button button-primary" id="captureButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h2.2l1.2-2h7.2l1.2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
              抓拍照片
            </button>
            <button class="button button-quiet" id="retakeButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8V3m0 0h-5M19 3l-3.2 3.2A7 7 0 1 0 19 16"/></svg>
              重新抓拍
            </button>
            <button class="button button-secondary" id="closeButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M9.5 6h6l1.3 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7M5 8a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h9"/></svg>
              关闭摄像头
            </button>
          </div>
        </section>

        <section class="result-panel" aria-labelledby="resultTitle">
          <h2 id="resultTitle">抓拍结果</h2>
          <div class="capture-frame" id="captureFrame">
            <img id="capturedImage" alt="抓拍的人脸照片">
            <div class="capture-empty" id="captureEmpty">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg>
              <span>暂无抓拍照片</span>
            </div>
          </div>

          <dl class="metadata">
            <div><dt>图片尺寸</dt><dd id="imageDimensions">—</dd></div>
            <div><dt>JPEG 大小</dt><dd id="imageSize">—</dd></div>
            <div><dt>Base64 长度</dt><dd id="base64Length">—</dd></div>
          </dl>

          <button class="button button-copy" id="copyButton" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></svg>
            复制 Base64
          </button>
        </section>
      </aside>
    </div>

    <footer>此演示不调用远程人脸比对 API，照片仅保留在当前页面内存中。</footer>
  </main>

  <script type="module" src="./demo.js"></script>
</body>
</html>
